name: Build profile card
on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~5am ET
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["today.py", "ascii.txt", ".github/workflows/build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Render SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit
        run: |
          git config user.name "Jacob Springer"
          git config user.email "jakemspringer@gmail.com"
          git add dark_mode.svg light_mode.svg cache
          git commit -m "Update profile card" || echo "No changes"
          git push
